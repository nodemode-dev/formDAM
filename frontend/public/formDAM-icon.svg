<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
  <defs>
    <!-- main red -> yellow gradient, axis measured from the source artwork -->
    <linearGradient id="dam-grad" gradientUnits="userSpaceOnUse"
                    x1="164.1" y1="764.6" x2="651.3" y2="325.7">
      <stop offset="0" stop-color="#FF292C"/>
      <stop offset="1" stop-color="#FFE758"/>
    </linearGradient>

    <!-- fade for the gloss band along the upper edge -->
    <linearGradient id="dam-sheen" gradientUnits="userSpaceOnUse"
                    x1="300.7" y1="183" x2="702.1" y2="414.6">
      <stop offset="0"    stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="0.62" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="1"    stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="dam-glint" gradientUnits="userSpaceOnUse"
                    cx="731" cy="452" r="46">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="dam-dotlight" gradientUnits="userSpaceOnUse"
                    cx="203" cy="722" r="62">
      <stop offset="0" stop-color="#fff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>

    <!-- the mark, reused for fill, clipping and the halo -->
    <path id="dam-m"
          d="M166 250.25
             A96 96 0 0 1 309.7 167.35
             L711.1 399
             A95.8 95.8 0 0 1 711.1 565
             L634 609.4
             A22 22 0 0 1 601 590.4
             L601 476.5
             A54.5 54.5 0 0 0 492 476.5
             L492 661
             A54 54 0 0 1 384 661
             L384 381.5
             A54.5 54.5 0 0 0 275 381.5
             L275 602.5
             A54.5 54.5 0 0 1 166 602.5
             Z"/>
    <circle id="dam-dot" cx="220.5" cy="746.5" r="54.5"/>

    <clipPath id="dam-plate">
      <path d="M96 156.5
               A104 104 0 0 1 252 66.5
               L811 389.4
               A104 104 0 0 1 811 569.6
               L252 892.5
               A104 104 0 0 1 96 802.5
               Z"/>
    </clipPath>

    <clipPath id="dam-mark">
      <use href="#dam-m"/>
      <use href="#dam-dot"/>
    </clipPath>

    <filter id="dam-halo" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <filter id="dam-soft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- black rounded play plate -->
  <path fill="#000000"
        d="M96 156.5
           A104 104 0 0 1 252 66.5
           L811 389.4
           A104 104 0 0 1 811 569.6
           L252 892.5
           A104 104 0 0 1 96 802.5
           Z"/>

  <!-- soft grey halo where the mark meets the plate -->
  <g clip-path="url(#dam-plate)">
    <g filter="url(#dam-halo)" fill="none" stroke="#2b2b2b" stroke-width="40">
      <use href="#dam-m"/>
      <use href="#dam-dot"/>
    </g>
  </g>

  <!-- the mark -->
  <use href="#dam-m" fill="url(#dam-grad)"/>
  <use href="#dam-dot" fill="url(#dam-grad)"/>

  <!-- highlights, kept inside the mark -->
  <g clip-path="url(#dam-mark)">
    <g filter="url(#dam-soft)">
      <path d="M300.7 183 L702.1 414.6" fill="none" stroke="url(#dam-sheen)"
            stroke-width="40" stroke-linecap="round"/>
      <circle cx="731" cy="452" r="46" fill="url(#dam-glint)"/>
      <circle cx="203" cy="722" r="62" fill="url(#dam-dotlight)"/>
    </g>
  </g>
</svg>
