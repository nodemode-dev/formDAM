name: diag-appimage

on:
  push:
    branches: ['diag/**']

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libssl-dev patchelf file
      - run: APPIMAGE=required setup/build_linux_app
      - if: always()
        run: |
          cd src-tauri
          echo "== engine: where liblcms2 lives =="
          find binaries/formdam-backend -name 'liblcms2*' -exec ls -la {} + || true
          echo "== engine: .libs folders =="
          find binaries/formdam-backend -type d -name '*.libs' || true
          echo "== engine: libraries ldd cannot resolve =="
          find binaries/formdam-backend -type f -name '*.so*' -exec ldd {} + 2>/dev/null | awk '/not found/ {print $1}' | sort | uniq -c || true
          echo "== AppDir: where liblcms2 lives =="
          find target/release/bundle/appimage -name 'liblcms2*' -exec ls -la {} + || true
          echo "== packages =="
          ls -la target/release/bundle/*/ || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appimage-step-log
          path: src-tauri/target/appimage-step.log
          if-no-files-found: warn
