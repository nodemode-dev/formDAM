[package]
name = "formdam-desktop"
version = "1.28.0"
description = "formDAM: local-first digital asset manager for photos & video"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
serde_json = "1"
ureq = { version = "2", features = ["json"] }
regex = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError", "NSValue"] }
objc2-local-authentication = { version = "0.3", features = ["LAContext", "block2"] }
block2 = "0.6"
security-framework = "3"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSResponder", "NSColor"] }
libloading = "0.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Foundation", "Security_Credentials_UI", "Win32_Foundation", "Win32_System_WinRT"] }
windows-future = "0.2"
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["async-secret-service", "async-io", "crypto-rust"] }

[profile.release]
strip = false
lto = true

[profile.release.build-override]
strip = false
debug = false
